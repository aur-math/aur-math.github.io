<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f3e8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="KIDmath">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>KIDmath</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="stylesheet" href="styles.css?v=6">
  </head>
  <body>
    <main class="app-shell">
      <section id="setup-view" class="view setup-view" aria-labelledby="app-title">
        <div class="brand-row">
          <div>
            <p class="eyebrow">KIDmath</p>
            <h1 id="app-title">数学小测</h1>
          </div>
          <div class="mini-score" aria-label="试卷预览">
            <span id="preview-count">20</span>
            <small>题</small>
          </div>
        </div>

        <form id="exam-form" class="settings-grid">
          <fieldset class="panel">
            <legend>年级难度</legend>
            <div class="segmented" role="radiogroup" aria-label="年级难度">
              <label><input type="radio" name="grade" value="1"><span>一年级</span></label>
              <label><input type="radio" name="grade" value="2" checked><span>二年级</span></label>
              <label><input type="radio" name="grade" value="3"><span>三年级</span></label>
              <label><input type="radio" name="grade" value="4"><span>四年级</span></label>
              <label><input type="radio" name="grade" value="5"><span>五年级</span></label>
            </div>
          </fieldset>

          <fieldset class="panel">
            <legend>计算方法</legend>
            <div class="operator-grid">
              <label><input type="checkbox" name="ops" value="+" checked><span>+</span></label>
              <label><input type="checkbox" name="ops" value="-" checked><span>-</span></label>
              <label><input type="checkbox" name="ops" value="*" checked><span>×</span></label>
              <label><input type="checkbox" name="ops" value="/"><span>÷</span></label>
            </div>
          </fieldset>

          <section class="panel range-panel" aria-labelledby="count-label">
            <div class="panel-head">
              <h2 id="count-label">题目数量</h2>
              <output id="count-output" for="question-count">20</output>
            </div>
            <input id="question-count" name="count" type="range" min="5" max="60" step="5" value="20">
          </section>

          <section class="panel range-panel" aria-labelledby="time-label">
            <div class="panel-head">
              <h2 id="time-label">考试时间</h2>
              <output id="time-output" for="exam-time">10 分钟</output>
            </div>
            <input id="exam-time" name="minutes" type="range" min="1" max="60" step="1" value="10">
          </section>

          <button class="primary-action" type="submit">开始考试</button>
        </form>

        <section class="history-section" aria-labelledby="history-title">
          <div class="section-head">
            <div>
              <p class="eyebrow">History</p>
              <h2 id="history-title">历史记录</h2>
            </div>
            <button id="clear-history" class="secondary-action small-action" type="button">清空记录</button>
          </div>
          <div id="history-list" class="history-list"></div>
        </section>
      </section>

      <section id="exam-view" class="view exam-view hidden" aria-labelledby="paper-title">
        <header class="exam-header">
          <div>
            <p class="eyebrow">正在考试</p>
            <h1 id="paper-title">数学小测</h1>
          </div>
          <div class="timer-box" aria-live="polite">
            <span id="timer">10:00</span>
            <small>剩余</small>
          </div>
        </header>

        <div class="progress-track" aria-hidden="true">
          <div id="time-progress" class="progress-fill"></div>
        </div>

        <div class="exam-layout">
          <section class="question-area" aria-label="题目">
            <div id="question-list" class="question-list"></div>
          </section>

          <aside class="scratch-panel" aria-label="草稿区域">
            <div class="scratch-head">
              <h2>草稿纸</h2>
              <button id="clear-canvas" class="icon-button" type="button" aria-label="清空草稿">
                <span aria-hidden="true">⌫</span>
              </button>
            </div>
            <canvas id="scratch-canvas"></canvas>
          </aside>
        </div>

        <footer class="exam-actions">
          <button id="finish-exam" class="primary-action compact" type="button">交卷</button>
        </footer>
      </section>

      <section id="result-view" class="view result-view hidden" aria-labelledby="result-title">
        <div class="result-hero">
          <p class="eyebrow">成绩</p>
          <h1 id="result-title"><span id="score-value">0</span> 分</h1>
          <p id="result-summary">答对 0 / 0 题</p>
          <p id="time-summary">已用 00:00，剩余 00:00</p>
        </div>

        <div id="review-list" class="review-list"></div>

        <div class="result-actions">
          <button id="retry-same" class="secondary-action" type="button">再做一张</button>
          <button id="back-setup" class="primary-action compact" type="button">主页</button>
        </div>
      </section>
    </main>

    <template id="question-template">
      <article class="question-card">
        <label>
          <span class="question-text"></span>
          <input class="answer-input" inputmode="decimal" autocomplete="off">
        </label>
      </article>
    </template>

    <script src="app.js?v=6" defer></script>
  </body>
</html>
